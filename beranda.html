<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECANTIO - Beranda Belanja</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1E3A2B;
            --accent: #D4AF37;
            --bg: #F4F6F4;
            --surface: #FFFFFF;
            --text-dark: #1A1A1A;
            --border: #E2E8F0;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-dark); padding-top: 60px; padding-bottom: 70px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
        @media (min-width: 768px) { body { max-width: 100%; padding-top: 70px; padding-bottom: 80px; } }

        header {
            position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--surface);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            border-bottom: 1px solid var(--border); z-index: 1000; max-width: 480px; margin: 0 auto;
        }
        @media (min-width: 768px) { header { max-width: 100%; height: 70px; padding: 0 40px; } }

        .brand-logo { font-size: 20px; font-weight: 700; color: var(--primary); letter-spacing: 1.5px; }
        .icon-btn { background: none; border: none; font-size: 20px; color: var(--primary); cursor: pointer; text-decoration: none; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--surface);
            display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border);
            z-index: 1000; max-width: 480px; margin: 0 auto;
        }
        @media (min-width: 768px) { .bottom-nav { max-width: 100%; height: 70px; } }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #666; text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); font-weight: 600; }

        .view { padding: 15px; }
        @media (min-width: 768px) { .view { padding: 30px 10%; } }

        .section-title { font-size: 16px; font-weight: 700; color: var(--primary); margin: 15px 0 10px 0; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        .product-card { background: var(--surface); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); }
        .product-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        .product-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; height: 32px; overflow: hidden; }
        .product-price { font-size: 14px; font-weight: 700; color: var(--primary); }
        .btn { width: 100%; padding: 8px; border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--primary); margin-top: 8px; }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">ECANTIO</div>
        <a href="keranjang.html" class="icon-btn">
            <i class="fa-solid fa-bag-shopping"></i>
        </a>
    </header>

    <main class="view">
        <div style="margin-bottom: 15px; font-size:13px;">Halo, <b id="display-user">Pembeli</b>! Selamat berbelanja.</div>

        <div class="section-title">Koleksi Pilihan Terbaru</div>
        <div class="product-grid" id="main-product-grid"></div>
    </main>

    <nav class="bottom-nav">
        <a href="beranda.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>Beranda</span></a>
        <a href="keranjang.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Keranjang</span></a>
        <a href="index.html" class="nav-item"><i class="fa-solid fa-right-from-bracket"></i><span>Keluar</span></a>
    </nav>

    <script>
        const products = [
            { id: 'p1', name: 'Jam Tangan Chronograph', price: 1850000, image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500' },
            { id: 'p2', name: 'Tas Kulit Tote Aesthetic', price: 890000, image: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500' },
            { id: 'p3', name: 'Laptop Simple Minimalis', price: 7250000, image: 'https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=500' },
            { id: 'p4', name: 'Sepatu Loafers Classic', price: 1250000, image: 'https://images.unsplash.com/photo-1533867617858-e7b97e060509?w=500' }
        ];

        const formatIDR = (price) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(price);

        window.onload = () => {
            const username = localStorage.getItem('buyer_user') || 'Pembeli';
            document.getElementById('display-user').innerText = username;

            const grid = document.getElementById('main-product-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image}" alt="${p.name}">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${formatIDR(p.price)}</div>
                        <button class="btn" onclick="addToCart('${p.name}', ${p.price})">+ Keranjang</button>
                    </div>
                `;
            });
        };

        function addToCart(name, price) {
            let cart = JSON.parse(localStorage.getItem('cart_items')) || [];
            cart.push({ name, price });
            localStorage.setItem('cart_items', JSON.stringify(cart));
            alert(name + ' berhasil ditambahkan ke keranjang!');
        }
    </script>
</body>
</html>
