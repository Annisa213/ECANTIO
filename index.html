<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECANTIO - Portal Masuk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1E3A2B;
            --secondary: #2C4D3B;
            --accent: #D4AF37;
            --bg: #F4F6F4;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .step-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: var(--radius);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            width: 100%;
            max-width: 420px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .role-btn {
            background: var(--secondary);
            color: white;
            padding: 14px;
            border-radius: var(--radius);
            border: 1px solid var(--accent);
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .role-btn:hover { background: var(--primary); border-color: #fff; }

        .divider-text {
            text-align: center;
            position: relative;
            margin: 18px 0;
            font-size: 12px;
            color: #aaa;
        }

        .divider-text::before, .divider-text::after {
            content: "";
            position: absolute;
            top: 50%; width: 35%; height: 1px;
            background: rgba(255,255,255,0.2);
        }
        .divider-text::before { left: 0; }
        .divider-text::after { right: 0; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #ddd; }
        .form-control {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1);
            color: white; font-size: 14px; outline: none;
        }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-primary { background: var(--accent); color: var(--primary); margin-top: 10px; }
        .btn-secondary { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); margin-top: 8px; }
    </style>
</head>
<body>

    <div class="step-card" id="card-role" style="text-align: center;">
        <div style="font-size: 40px; margin-bottom: 10px;">🍃</div>
        <h2 style="font-size: 24px; color: var(--accent); margin-bottom: 8px;">ECANTIO Store</h2>
        <p style="font-size: 13px; color: #ccc; margin-bottom: 20px;">Selamat datang! Pilih role untuk melanjutkan.</p>
        
        <button class="role-btn" onclick="showBuyerForm()">
            <i class="fa-solid fa-cart-shopping"></i> Masuk sebagai Pembeli
        </button>
        <div class="divider-text">atau</div>
        <button class="role-btn" onclick="showSellerForm()">
            <i class="fa-solid fa-store"></i> Masuk sebagai Penjual
        </button>
    </div>

    <!-- Form Pembeli -->
    <div class="step-card" id="card-buyer" style="display: none;">
        <h2 style="color: var(--accent); margin-bottom: 5px;">Registrasi Pembeli</h2>
        <p style="font-size: 12px; color: #ccc; margin-bottom: 15px;">Lengkapi data diri Anda untuk mulai berbelanja.</p>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="b-email" class="form-control" placeholder="nama@email.com">
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="b-username" class="form-control" placeholder="username">
        </div>
        <div class="form-group">
            <label>Nomor Telepon</label>
            <input type="tel" id="b-phone" class="form-control" placeholder="08123456789">
        </div>
        <button class="btn btn-primary" onclick="loginBuyer()">Selesai & Masuk Belanja</button>
        <button class="btn btn-secondary" onclick="showRole()">Kembali Pilih Role</button>
    </div>

    <!-- Form Penjual -->
    <div class="step-card" id="card-seller" style="display: none;">
        <h2 style="color: var(--accent); margin-bottom: 5px;">Login Penjual</h2>
        <p style="font-size: 12px; color: #ccc; margin-bottom: 15px;">Masuk ke Portal Seller ECANTIO.</p>
        <div class="form-group">
            <label>Nama Toko / Username</label>
            <input type="text" id="s-username" class="form-control" placeholder="Toko Official ECANTIO">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="s-pass" class="form-control" placeholder="******">
        </div>
        <button class="btn btn-primary" onclick="loginSeller()">Masuk Portal Penjual</button>
        <button class="btn btn-secondary" onclick="showRole()">Kembali Pilih Role</button>
    </div>

    <script>
        function showBuyerForm() {
            document.getElementById('card-role').style.display = 'none';
            document.getElementById('card-buyer').style.display = 'block';
        }
        function showSellerForm() {
            document.getElementById('card-role').style.display = 'none';
            document.getElementById('card-seller').style.display = 'block';
        }
        function showRole() {
            document.getElementById('card-buyer').style.display = 'none';
            document.getElementById('card-seller').style.display = 'none';
            document.getElementById('card-role').style.display = 'block';
        }

        function loginBuyer() {
            const user = document.getElementById('b-username').value;
            const email = document.getElementById('b-email').value;
            const phone = document.getElementById('b-phone').value;
            if(!user || !email || !phone) return alert('Harap isi semua data');

            localStorage.setItem('ecantio_user', JSON.stringify({ username: user, email: email, phone: phone, isVip: false }));
            window.location.href = 'beranda.html';
        }

        function loginSeller() {
            const store = document.getElementById('s-username').value;
            if(!store) return alert('Harap isi nama toko');

            localStorage.setItem('ecantio_seller', store);
            window.location.href = 'penjual.html';
        }
    </script>
</body>
</html>
