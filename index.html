<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECANTIO - Pilih Role</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1E3A2B;
            --secondary: #2C4D3B;
            --accent: #D4AF37;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .step-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px 25px;
            border-radius: var(--radius);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            width: 100%; max-width: 400px;
            text-align: center; color: white;
        }
        .step-card h2 { font-size: 24px; margin-bottom: 8px; color: var(--accent); }
        .step-card p { font-size: 13px; color: #ccc; margin-bottom: 25px; }
        .role-btn {
            background: var(--secondary); color: white;
            padding: 14px; border-radius: var(--radius);
            border: 1px solid var(--accent); font-weight: 600;
            font-size: 14px; width: 100%; display: flex;
            align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; text-decoration: none; transition: 0.2s;
            margin-bottom: 10px;
        }
        .role-btn:hover { background: #3c654e; }
        .divider-text {
            text-align: center; position: relative; margin: 18px 0;
            font-size: 12px; color: #aaa;
        }
        .divider-text::before, .divider-text::after {
            content: ""; position: absolute; top: 50%; width: 35%; height: 1px;
            background: rgba(255,255,255,0.2);
        }
        .divider-text::before { left: 0; }
        .divider-text::after { right: 0; }
    </style>
</head>
<body>

    <div class="step-card">
        <div style="font-size: 40px; margin-bottom: 10px;">🍃</div>
        <h2>ECANTIO Store</h2>
        <p>Selamat datang! Pilih role untuk melanjutkan.</p>
        
        <a href="login-pembeli.html" class="role-btn">
            <i class="fa-solid fa-cart-shopping"></i> Masuk sebagai Pembeli
        </a>
        
        <div class="divider-text">atau</div>
        
        <a href="login-penjual.html" class="role-btn">
            <i class="fa-solid fa-store"></i> Masuk sebagai Penjual
        </a>
    </div>

</body>
</html>
