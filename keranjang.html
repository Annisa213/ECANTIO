<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECANTIO - Keranjang</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1E3A2B;
            --accent: #D4AF37;
            --bg: #F4F6F4;
            --surface: #FFFFFF;
            --border: #E2E8F0;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); padding-top: 60px; padding-bottom: 70px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
        header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); max-width: 480px; margin: 0 auto; }
        .brand-logo { font-size: 18px; font-weight: 700; color: var(--primary); }
        .view { padding: 15px; }
        .cart-item { background: var(--surface); padding: 12px; border-radius: var(--radius); margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 13px; }
        .summary-card { background: var(--surface); padding: 15px; border-radius: var(--radius); margin-top: 20px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--primary); margin-top: 10px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--surface); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); max-width: 480px; margin: 0 auto; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #666; text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">Keranjang Belanja</div>
    </header>

    <main class="view">
        <div id="cart-list"></div>
        <div class="summary-card">
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:15px; color:var(--primary);">
                <span>Total Bayar</span>
                <span id="total-price">Rp 0</span>
            </div>
            <button class="btn" onclick="checkout()">Checkout Sekarang</button>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="beranda.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Beranda</span></a>
        <a href="keranjang.html" class="nav-item active"><i class="fa-solid fa-cart-shopping"></i><span>Keranjang</span></a>
        <a href="index.html" class="nav-item"><i class="fa-solid fa-right-from-bracket"></i><span>Keluar</span></a>
    </nav>

    <script>
        const formatIDR = (price) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(price);

        window.onload = () => {
            const cart = JSON.parse(localStorage.getItem('cart_items')) || [];
            const container = document.getElementById('cart-list');
            let total = 0;

            if(cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">Keranjang kamu masih kosong.</p>';
            } else {
                container.innerHTML = '';
                cart.forEach((item) => {
                    total += item.price;
                    container.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <b>${item.name}</b>
                                <div style="color:var(--primary); font-weight:bold; margin-top:4px;">${formatIDR(item.price)}</div>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('total-price').innerText = formatIDR(total);
        };

        function checkout() {
            alert('Pesanan berhasil dibuat! Terima kasih sudah berbelanja.');
            localStorage.removeItem('cart_items');
            window.location.href = 'beranda.html';
        }
    </script>
</body>
</html>
