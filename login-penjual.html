<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECANTIO - Login Penjual</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1E3A2B;
            --accent: #D4AF37;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px; color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.05); padding: 25px;
            border-radius: var(--radius); backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2); width: 100%; max-width: 400px;
        }
        h2 { color: var(--accent); margin-bottom: 8px; font-size: 22px; }
        p { font-size: 12px; color: #ccc; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #ddd; }
        .form-control {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1);
            color: white; font-size: 14px; outline: none;
        }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer; margin-top: 10px; text-align: center;
            text-decoration: none; display: block;
        }
        .btn-primary { background: var(--accent); color: var(--primary); }
        .btn-secondary { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <div class="card">
        <h2>Login Portal Penjual</h2>
        <p>Masuk ke dashboard seller untuk mengelola toko.</p>
        <form onsubmit="handleSellerLogin(event)">
            <div class="form-group">
                <label>Nama Toko / Username Seller</label>
                <input type="text" id="seller-name" class="form-control" placeholder="Toko Official ECANTIO" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="******" required>
            </div>
            <button type="submit" class="btn btn-primary">Masuk Dashboard Seller</button>
            <a href="index.html" class="btn btn-secondary">Kembali Pilih Role</a>
        </form>
    </div>

    <script>
        function handleSellerLogin(e) {
            e.preventDefault();
            localStorage.setItem('seller_store_name', document.getElementById('seller-name').value);
            window.location.href = 'penjual.html';
        }
    </script>
</body>
</html>
