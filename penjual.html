<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECANTIO - Portal Seller</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1E3A2B;
            --accent: #D4AF37;
            --bg: #F4F6F4;
            --surface: #FFFFFF;
            --text-dark: #1A1A1A;
            --border: #E2E8F0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); padding-top: 60px; max-width: 600px; margin: 0 auto; min-height: 100vh; }

        header {
            position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--surface);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            border-bottom: 1px solid var(--border); max-width: 600px; margin: 0 auto;
        }
        .brand-logo { font-size: 18px; font-weight: 700; color: var(--primary); }

        .view { padding: 15px; }
        .seller-card { background: var(--surface); padding: 15px; border-radius: var(--radius); margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
        .form-control { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); outline: none; }

        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--primary); }
        .badge-status { background: #EBF8FF; color: #2B6CB0; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">ECANTIO SELLER</div>
        <a href="index.html" style="color: red; text-decoration: none; font-size: 12px; font-weight: bold;">Keluar / Switch Role</a>
    </header>

    <main class="view">
        <div class="seller-card" style="text-align: center; background: linear-gradient(135deg, var(--primary), #2C4D3B); color: white;">
            <h3 id="seller-store-display-name">Toko Official</h3>
            <span class="badge-status" style="background: var(--accent); color: var(--primary); margin-top:5px; display:inline-block;">Penjual Terverifikasi</span>
        </div>

        <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px; color: var(--primary);">Tambah Produk Baru Toko</div>
        <div class="seller-card">
            <div class="form-group">
                <label>Nama Produk</label>
                <input type="text" id="new-prod-name" class="form-control" placeholder="misal: Sepatu Leather Exclusive">
            </div>
            <div class="form-group">
                <label>Harga (Rp)</label>
                <input type="number" id="new-prod-price" class="form-control" placeholder="250000">
            </div>
            <div class="form-group">
                <label>URL Gambar (Unsplash)</label>
                <input type="text" id="new-prod-img" class="form-control" value="https://images.unsplash.com/photo-1541807084-5c52b6b3adef">
            </div>
            <div class="form-group">
                <label>Deskripsi Produk</label>
                <textarea id="new-prod-desc" class="form-control" rows="2" placeholder="Deskripsi lengkap produk..."></textarea>
            </div>
            <button class="btn" onclick="addNewProductFromSeller()"><i class="fa-solid fa-plus"></i> Publish Produk</button>
        </div>

        <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px; color: var(--primary);">Notifikasi Pesanan Masuk Penjual</div>
        <div id="seller-incoming-orders-list"></div>
    </main>

    <script>
        const formatIDR = (price) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(price);

        window.onload = () => {
            const store = localStorage.getItem('ecantio_seller') || 'Toko Official ECANTIO';
            document.getElementById('seller-store-display-name').innerText = store;

            renderSellerOrders();
        };

        function renderSellerOrders() {
            let orders = JSON.parse(localStorage.getItem('ecantio_orders')) || [];
            const container = document.getElementById('seller-incoming-orders-list');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:#888;">Belum ada pesanan masuk dari pembeli.</p>';
                return;
            }

            orders.forEach(order => {
                let itemsList = order.items.map(i => `<li style="font-size:12px;">${i.name} x${i.qty}</li>`).join('');
                container.innerHTML += `
                    <div class="seller-card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <span style="font-weight:700; color:var(--primary);">${order.id}</span>
                            <span class="badge-status">Pesanan Baru</span>
                        </div>
                        <div style="font-size:11px; color:var(--text-muted); margin-bottom:6px;">Tanggal: ${order.date}</div>
                        <ul style="padding-left:15px; margin-bottom:8px;">${itemsList}</ul>
                        <div style="font-weight:bold; font-size:13px; color:var(--primary);">Total: ${formatIDR(order.total)}</div>
                    </div>
                `;
            });
        }

        function addNewProductFromSeller() {
            const name = document.getElementById('new-prod-name').value;
            const price = document.getElementById('new-prod-price').value;
            const img = document.getElementById('new-prod-img').value;
            const desc = document.getElementById('new-prod-desc').value;

            if (!name || !price || !img || !desc) {
                return alert('Harap lengkapi semua data produk');
            }

            let products = JSON.parse(localStorage.getItem('ecantio_products')) || [];

            const newProd = {
                id: 'p' + (products.length + 1),
                name: name,
                price: parseInt(price),
                rating: 5.0,
                sold: 0,
                image: img,
                desc: desc,
                bestseller: false
            };

            products.unshift(newProd);
            localStorage.setItem('ecantio_products', JSON.stringify(products));

            alert('Produk Berhasil Ditambahkan ke Katalog!');
            document.getElementById('new-prod-name').value = '';
            document.getElementById('new-prod-price').value = '';
            document.getElementById('new-prod-desc').value = '';
        }
    </script>
</body>
</html>
