<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECANTIO - Portal Penjual</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1E3A2B;
            --accent: #D4AF37;
            --bg: #F4F6F4;
            --surface: #FFFFFF;
            --border: #E2E8F0;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); padding-top: 60px; padding-bottom: 70px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
        header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); max-width: 480px; margin: 0 auto; }
        .brand-logo { font-size: 18px; font-weight: 700; color: var(--primary); }
        .view { padding: 15px; }
        .seller-card { background: var(--surface); padding: 15px; border-radius: var(--radius); margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
        .form-control { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); outline: none; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--primary); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--surface); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); max-width: 480px; margin: 0 auto; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #666; text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">ECANTIO SELLER</div>
    </header>

    <main class="view">
        <div class="seller-card" style="text-align: center; background: linear-gradient(135deg, var(--primary), #2C4D3B); color: white;">
            <h3 id="seller-display-name">Toko Official</h3>
            <span style="font-size:11px; background:var(--accent); color:var(--primary); padding:2px 8px; border-radius:10px; font-weight:bold; margin-top:5px; display:inline-block;">Penjual Terverifikasi</span>
        </div>

        <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px; color: var(--primary);">Tambah Produk Baru Toko</div>
        <div class="seller-card">
            <form onsubmit="addProduct(event)">
                <div class="form-group">
                    <label>Nama Produk</label>
                    <input type="text" id="p-name" class="form-control" placeholder="misal: Tas Leather" required>
                </div>
                <div class="form-group">
                    <label>Harga (Rp)</label>
                    <input type="number" id="p-price" class="form-control" placeholder="250000" required>
                </div>
                <button type="submit" class="btn"><i class="fa-solid fa-plus"></i> Publish Produk</button>
            </form>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="penjual.html" class="nav-item active"><i class="fa-solid fa-store"></i><span>Toko Saya</span></a>
        <a href="index.html" class="nav-item"><i class="fa-solid fa-right-from-bracket"></i><span>Keluar</span></a>
    </nav>

    <script>
        window.onload = () => {
            const storeName = localStorage.getItem('seller_store_name') || 'Toko Official ECANTIO';
            document.getElementById('seller-display-name').innerText = storeName;
        };

        function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            alert('Produk "' + name + '" berhasil dipublish ke toko!');
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
        }
    </script>
</body>
</html>
