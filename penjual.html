<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECANTIO - Portal Penjual</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1E3A2B;
            --accent: #D4AF37;
            --bg: #F4F6F4;
            --surface: #FFFFFF;
            --text-dark: #1A1A1A;
            --border: #E2E8F0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); padding-top: 60px; max-width: 600px; margin: 0 auto; min-height: 100vh; }

        header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); max-width: 600px; margin: 0 auto; }
        .brand-logo { font-size: 18px; font-weight: 700; color: var(--primary); }

        .view { padding: 15px; }
        .card { background: var(--surface); padding: 15px; border-radius: var(--radius); margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
        .form-control { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); outline: none; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">ECANTIO SELLER</div>
        <a href="index.html" style="color:red; text-decoration:none; font-size:12px; font-weight:bold;">Keluar</a>
    </header>

    <main class="view">
        <!-- Profile Seller -->
        <div class="card" style="text-align: center; background: linear-gradient(135deg, var(--primary), #2C4D3B); color: white;">
            <h3 id="seller-title">Toko Official</h3>
            <span style="font-size:11px; background:var(--accent); color:var(--primary); padding:2px 8px; border-radius:10px; font-weight:bold; margin-top:5px; display:inline-block;">Penjual Terverifikasi</span>
        </div>

        <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px; color: var(--primary);">Tambah Produk Baru Toko</div>
        <div class="card">
            <div class="form-group">
                <label>Nama Produk</label>
                <input type="text" id="p-name" class="form-control" placeholder="misal: Sepatu Leather Exclusive">
            </div>
            <div class="form-group">
                <label>Harga (Rp)</label>
                <input type="number" id="p-price" class="form-control" placeholder="250000">
            </div>
            <div class="form-group">
                <label>Deskripsi Produk</label>
                <textarea id="p-desc" class="form-control" rows="2" placeholder="Deskripsi..."></textarea>
            </div>
            <button class="btn" onclick="publishProduct()"><i class="fa-solid fa-plus"></i> Publish Produk</button>
        </div>

        <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px; color: var(--primary);">Notifikasi Pesanan Masuk</div>
        <div id="incoming-orders"></div>
    </main>

    <script>
        const formatIDR = (price) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(price);

        window.onload = () => {
            const store = localStorage.getItem('ecantio_seller') || 'Toko Official ECANTIO';
            document.getElementById('seller-title').innerText = store;

            let orders = JSON.parse(localStorage.getItem('ecantio_orders')) || [];
            const container = document.getElementById('incoming-orders');

            if(orders.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:#888;">Belum ada pesanan masuk dari pembeli.</p>';
            } else {
                orders.forEach(o => {
                    container.innerHTML += `
                        <div class="card">
                            <b style="color:var(--primary); font-size:12px;">${o.id}</b>
                            <div style="font-size:12px; margin-top:4px;">Total Pesanan: ${formatIDR(o.total)}</div>
                        </div>
                    `;
                });
            }
        };

        function publishProduct() {
            const name = document.getElementById('p-name').value;
            if(!name) return alert('Isi nama produk');
            alert('Produk ' + name + ' Berhasil Dipublish ke Katalog!');
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-desc').value = '';
        }
    </script>
</body>
</html>
